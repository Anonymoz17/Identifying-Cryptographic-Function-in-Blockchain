name: Deploy Cryptoscope web to GitHub Pages

on:
  push:
    branches:
      - main        # change if your default branch is different
  workflow_dispatch:  # allow manual trigger in Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web   # <<< all commands run inside web/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        run: npm run build       # uses web/package.json → "vite build"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist         # built files are in web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
